<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RBF Server</title>
  <style>
    body { margin: 0; font-family: Helvetica, Arial, sans-serif; background: #f5f6ef; color: #182225; }
    .app { max-width: 1180px; margin: 0 auto; padding: 12px; display: grid; grid-template-columns: 1.6fr 1fr; gap: 12px; }
    .panel { background: #fffdf7; border: 1px solid #d8d7cf; border-radius: 12px; padding: 10px; }
    canvas { width: 100%; border: 1px solid #d8d7cf; border-radius: 10px; background: #fff; display: block; }
    #field { height: 520px; margin-bottom: 10px;}
    #recon { height: 200px; }
    #latent { height: 30px; ; margin-bottom: 10px; }
    #influence { height: 120px; }
    .row { display: grid; grid-template-columns: 90px 1fr 60px; gap: 8px; align-items: center; margin: 8px 0; }
    .btns { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
    button { border: 1px solid #ced3cc; background: #fff; border-radius: 8px; padding: 6px 9px; cursor: pointer; }
    button.active { background: #cbeceb; border-color: #2b7e7a; }
    textarea { width: 100%; min-height: 100px; border-radius: 8px; border: 1px solid #ced3cc; padding: 8px; font-family: Menlo, monospace; font-size: 12px; }
    pre { background: #f1fbfb; border: 1px solid #d2eeee; border-radius: 8px; padding: 8px; min-height: 80px; font-size: 12px; white-space: pre-wrap; }
    .status-indicator { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; font-weight: 600; }
    .status-led { width: 10px; height: 10px; border-radius: 999px; background: #c94d44; box-shadow: 0 0 0 2px rgba(0,0,0,0.08); }
    .status-led.connected { background: #2d9d5b; }
    .select-row { display: grid; grid-template-columns: 90px 1fr; gap: 8px; align-items: center; margin: 8px 0; }
    select { border: 1px solid #ced3cc; border-radius: 8px; background: #fff; padding: 6px; }
    @media (max-width: 980px) { .app { grid-template-columns: 1fr; } #field { height: 420px; } }
  </style>
</head>
<body>
  <div class="app">
    <div class="panel">
      <h3>RBF Latent Field Server</h3>
      <canvas id="field"></canvas>
      <h4>Latent Vector</h4>
      <canvas id="latent"></canvas>
      <h4>Reconstruction</h4>
      <canvas id="recon"></canvas>
    </div>
    <div class="panel">
      <h4>Anchor Influence</h4>
      <canvas id="influence"></canvas>
      <div class="row"><label>Grid</label><input id="grid" type="range" min="4" max="60" step="1" /><span id="gridVal"></span></div>
      <div class="row"><label>Sigma</label><input id="sigma" type="range" min="0.05" max="3" step="0.01" /><span id="sigmaVal"></span></div>
      <div class="btns">
        <button id="modeBtn">Heat: Mag</button>
        <button id="influenceBtn">Influence: Raw</button>
        <button id="decodeBtn">Decode: Off</button>
        <button id="quantizeBtn">Mode: Continuous</button>
      </div>
      <h4>Model Checkpoint</h4>
      <div class="select-row"><label for="checkpointMode">Mode</label><select id="checkpointMode"></select></div>
      <div class="select-row"><label for="checkpointStamp">Timestamp</label><select id="checkpointStamp"></select></div>
      <div class="select-row"><label>Loaded</label><div id="modelStatus">(unknown)</div></div>
      <h4>Status</h4>
      <div class="status-indicator"><span id="statusLed" class="status-led"></span><span id="statusText">Disconnected</span></div>
      <pre id="status">connecting...</pre>
    </div>
  </div>
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
const S = {
  cursor: [0, 0],
  points: [],
  heatmap: [],
  latent: [],
  recon: [],
  influenceRaw: [],
  influencePct: [],
  grid: 30,
  sigma: 0.3,
  heatMode: "magnitude",
  influenceMode: "raw",
  decodeEnabled: false,
  halfExtent: 2.0,
  nTiming: 4,
  decodeStatus: "idle",
  decodeStep: -1,
  requestCounter: 0,
  dragging: -1,
  quantized: false,
  quantizedCell: -1,
  snappedCursor: [0, 0],
  snappedPoints: [],
};

const field = document.getElementById("field");
const recon = document.getElementById("recon");
const latent = document.getElementById("latent");
const influence = document.getElementById("influence");
const statusEl = document.getElementById("status");
const statusLed = document.getElementById("statusLed");
const statusText = document.getElementById("statusText");
const gridEl = document.getElementById("grid");
const sigmaEl = document.getElementById("sigma");
const gridVal = document.getElementById("gridVal");
const sigmaVal = document.getElementById("sigmaVal");
const modeBtn = document.getElementById("modeBtn");
const influenceBtn = document.getElementById("influenceBtn");
const decodeBtn = document.getElementById("decodeBtn");
const quantizeBtn = document.getElementById("quantizeBtn");
const checkpointModeEl = document.getElementById("checkpointMode");
const checkpointStampEl = document.getElementById("checkpointStamp");
const modelStatusEl = document.getElementById("modelStatus");

let modelCatalog = { modes: {} };
let modelSelection = { mode: "none", previous: 0, timestamp: null };
let suppressModelEvents = false;
let pendingModelSwitch = null;

let socket = null;
let frameInFlight = false;
let queuedPayload = null;

function setConnectionState(connected) {
  statusLed.classList.toggle("connected", connected);
  statusText.textContent = connected ? "Connected" : "Disconnected";
}

function sizeCanvas(c) {
  const r = c.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.floor(r.width * dpr));
  const h = Math.max(1, Math.floor(r.height * dpr));
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
}

function toCanvas(p) {
  const x = ((p[0] + S.halfExtent) / (2 * S.halfExtent)) * field.width;
  const y = field.height - ((p[1] + S.halfExtent) / (2 * S.halfExtent)) * field.height;
  return [x, y];
}

function toWorld(x, y) {
  return [
    (x / field.width) * (2 * S.halfExtent) - S.halfExtent,
    ((field.height - y) / field.height) * (2 * S.halfExtent) - S.halfExtent,
  ];
}

function snapToGrid(wx, wy) {
  if (!S.quantized) return [wx, wy];
  const cellSize = (2 * S.halfExtent) / S.grid;
  const col = Math.max(0, Math.min(S.grid - 1, Math.floor((wx + S.halfExtent) / cellSize)));
  const row = Math.max(0, Math.min(S.grid - 1, Math.floor((wy + S.halfExtent) / cellSize)));
  return [
    -S.halfExtent + (col + 0.5) * cellSize,
    -S.halfExtent + (row + 0.5) * cellSize,
  ];
}

function gridCell(wx, wy) {
  const cellSize = (2 * S.halfExtent) / S.grid;
  const col = Math.max(0, Math.min(S.grid - 1, Math.floor((wx + S.halfExtent) / cellSize)));
  const row = Math.max(0, Math.min(S.grid - 1, Math.floor((wy + S.halfExtent) / cellSize)));
  return row * S.grid + col;
}

function drawField() {
  sizeCanvas(field);
  const ctx = field.getContext("2d");
  ctx.clearRect(0, 0, field.width, field.height);
  const hm = S.heatmap;
  if (hm.length > 1 && hm[0].length > 1) {
    const rows = hm.length;
    const cols = hm[0].length;
    const cw = field.width / cols;
    const ch = field.height / rows;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const v = Math.max(0, Math.min(1, hm[r][c]));
        const g = Math.floor(188 + 67 * v);
        ctx.fillStyle = `rgb(${g},${g},${g})`;
        ctx.fillRect(c * cw, field.height - (r + 1) * ch, cw + 1, ch + 1);
      }
    }
  }
  ctx.strokeStyle = "rgba(120,120,120,0.3)";
  for (let i = 0; i <= S.grid; i++) {
    const x = (i / S.grid) * field.width;
    const y = (i / S.grid) * field.height;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, field.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(field.width, y); ctx.stroke();
  }
  S.points.forEach((p, i) => {
    const [x, y] = toCanvas(p);
    ctx.fillStyle = "#0f5d6f";
    ctx.strokeStyle = "#f5fcfc";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 16px Menlo";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(String(i), x, y);
    ctx.textAlign = "start";
    ctx.textBaseline = "alphabetic";
  });
  const [cx, cy] = toCanvas(S.cursor);
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 8;
  ctx.beginPath();
  const crossSize = 25;
  ctx.moveTo(cx - crossSize, cy); ctx.lineTo(cx + crossSize, cy);
  ctx.moveTo(cx, cy - crossSize); ctx.lineTo(cx, cy + crossSize);
  ctx.stroke();
  ctx.strokeStyle = "#ad442a";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(cx - crossSize, cy); ctx.lineTo(cx + crossSize, cy);
  ctx.moveTo(cx, cy - crossSize); ctx.lineTo(cx, cy + crossSize);
  ctx.stroke();
  ctx.lineWidth = 1;
}

function drawLatent() {
  sizeCanvas(latent);
  const ctx = latent.getContext("2d");
  ctx.clearRect(0, 0, latent.width, latent.height);
  if (!S.latent.length) return;
  const w = latent.width / S.latent.length;
  for (let i = 0; i < S.latent.length; i++) {
    const v = Math.max(-4, Math.min(4, S.latent[i]));
    let r;
    let g;
    let b;
    if (v < 0) {
      const t = (v + 4) / 4;
      r = Math.floor(86 + 94 * t);
      g = Math.floor(104 + 76 * t);
      b = Math.floor(178 + 2 * t);
    } else {
      const t = v / 4;
      r = Math.floor(180 + 52 * t);
      g = Math.floor(180 - 96 * t);
      b = Math.floor(180 - 88 * t);
    }
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(i * w, 0, Math.ceil(w), latent.height);
  }
}

function drawInfluence() {
  sizeCanvas(influence);
  const ctx = influence.getContext("2d");
  ctx.clearRect(0, 0, influence.width, influence.height);
  const vals = S.influenceMode === "percentage" ? S.influencePct : S.influenceRaw;
  if (!vals.length) return;
  const bw = Math.max(4, influence.width / (vals.length * 1.4));
  const gap = bw * 0.4;
  vals.forEach((v, i) => {
    const h = Math.max(0, Math.min(1, v)) * (influence.height - 20);
    const x = i * (bw + gap);
    ctx.fillStyle = "#2e8b55";
    ctx.fillRect(x, influence.height - h - 16, bw, h);
  });
}

function drawRecon() {
  sizeCanvas(recon);
  const ctx = recon.getContext("2d");
  ctx.clearRect(0, 0, recon.width, recon.height);
  if (!S.recon.length || !S.recon[0].length) return;
  const rows = S.recon.length;
  const cols = S.recon[0].length;
  const cw = recon.width / cols;
  const ch = recon.height / rows;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const v = Math.max(0, Math.min(1, S.recon[r][c]));
      const g = Math.floor(255 - 240 * v);
      ctx.fillStyle = `rgb(${g},${g},${g})`;
      ctx.fillRect(c * cw, recon.height - (r + 1) * ch, cw + 1, ch + 1);
    }
  }
  ctx.strokeStyle = "rgba(80,80,80,0.3)";
  for (let c = 0; c <= cols; c += Math.max(1, S.nTiming)) {
    const x = c * cw;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, recon.height); ctx.stroke();
  }
  ctx.strokeStyle = "rgba(80,80,80,0.2)";
  for (let r = 0; r <= rows; r++) {
    const y = recon.height - r * ch;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(recon.width, y); ctx.stroke();
  }
}

function render() {
  drawField(); drawLatent(); drawInfluence(); drawRecon();
  statusEl.textContent = [
    `cursor=(${S.cursor[0].toFixed(3)}, ${S.cursor[1].toFixed(3)})`,
    `grid=${S.grid} sigma=${S.sigma.toFixed(2)} heat=${S.heatMode}`,
    `latent_dim=${S.latent.length} points=${S.points.length}`,
    `decode_status=${S.decodeStatus} decode_step=${S.decodeStep}`,
  ].join("\n");
}

function prettyModeLabel(mode) {
  if (mode === "none") return "None";
  return mode;
}

function updateModelStatus() {
  const mode = prettyModeLabel(modelSelection.mode || "none");
  const stamp = modelSelection.timestamp || "(no timestamp)";
  modelStatusEl.textContent = `${mode} @ ${stamp}`;
}

function renderModelSelectors() {
  suppressModelEvents = true;

  const modes = modelCatalog.modes || {};
  const modeOrder = ["best_val", "best_train", "last", "none"];
  checkpointModeEl.innerHTML = "";

  modeOrder.forEach((mode) => {
    const info = modes[mode] || { enabled: false };
    const opt = document.createElement("option");
    opt.value = mode;
    opt.textContent = prettyModeLabel(mode);
    opt.disabled = !info.enabled;
    checkpointModeEl.appendChild(opt);
  });

  let selectedMode = modelSelection.mode;
  if (!modes[selectedMode] || !modes[selectedMode].enabled) {
    const fallback = modeOrder.find((m) => modes[m] && modes[m].enabled);
    selectedMode = fallback || "none";
  }
  checkpointModeEl.value = selectedMode;
  modelSelection.mode = selectedMode;

  const items = (modes[selectedMode] && modes[selectedMode].items) ? modes[selectedMode].items : [];
  checkpointStampEl.innerHTML = "";
  items.forEach((item, idx) => {
    const opt = document.createElement("option");
    opt.value = String(item.previous);
    opt.textContent = item.timestamp || `index ${idx}`;
    checkpointStampEl.appendChild(opt);
  });

  checkpointStampEl.disabled = items.length === 0;
  if (items.length > 0) {
    const wanted = String(modelSelection.previous ?? 0);
    const hasWanted = items.some((item) => String(item.previous) === wanted);
    checkpointStampEl.value = hasWanted ? wanted : String(items[0].previous);
    modelSelection.previous = Number(checkpointStampEl.value);
    modelSelection.timestamp = (items.find((it) => String(it.previous) === checkpointStampEl.value) || items[0]).timestamp;
  } else {
    modelSelection.previous = 0;
    modelSelection.timestamp = null;
  }

  updateModelStatus();

  suppressModelEvents = false;
}

function payload() {
  return {
    cursor: S.snappedCursor,
    draggable_points: S.snappedPoints.length === S.points.length ? S.snappedPoints : S.points,
    heatmap: null,
    latent_vector: null,
    midi_buffer: null,
    influence_values: null,
    button_values: { heatmapMode: S.heatMode, influenceMode: S.influenceMode, encodeMidi: false, decodeEnabled: S.decodeEnabled },
    slider_values: { gridResolution: S.grid, sigma: S.sigma },
  };
}

function flushPayload(force = false) {
  if (!queuedPayload || !socket || !socket.connected) return;
  if (frameInFlight && !force) return;
  frameInFlight = true;
  const p = queuedPayload;
  queuedPayload = null;
  socket.emit("frame", p);
}

function sendPayload(force = false) {
  queuedPayload = payload();
  if (socket && socket.connected) {
    flushPayload(force);
  }
}

function pointerXY(evt, canvas) {
  const rect = canvas.getBoundingClientRect();
  return [
    (evt.clientX - rect.left) * (canvas.width / rect.width),
    (evt.clientY - rect.top) * (canvas.height / rect.height),
  ];
}

function pickPoint(x, y) {
  let best = -1;
  let bestDist = 1e9;
  S.points.forEach((p, i) => {
    const [px, py] = toCanvas(p);
    const d = Math.hypot(px - x, py - y);
    if (d < bestDist) { bestDist = d; best = i; }
  });
  return bestDist <= 16 ? best : -1;
}

field.addEventListener("pointerdown", (evt) => {
  sizeCanvas(field);
  const [x, y] = pointerXY(evt, field);
  const idx = pickPoint(x, y);
  if (idx >= 0) {
    S.dragging = idx;
  } else {
    const raw = toWorld(x, y);
    S.cursor = raw;
    S.snappedCursor = snapToGrid(raw[0], raw[1]);
    const cell = gridCell(S.snappedCursor[0], S.snappedCursor[1]);
    if (!S.quantized || cell !== S.quantizedCell) {
      S.quantizedCell = cell;
      sendPayload();
    }
  }
  render();
  field.setPointerCapture(evt.pointerId);
});

field.addEventListener("pointermove", (evt) => {
  if (S.dragging < 0 && evt.buttons === 0) return;
  sizeCanvas(field);
  const [x, y] = pointerXY(evt, field);
  const raw = toWorld(x, y);
  if (S.dragging >= 0) {
    S.points[S.dragging] = raw;
    S.snappedPoints = S.points.map(p => snapToGrid(p[0], p[1]));
    render();
    const dragCell = S.points.map(p => gridCell(snapToGrid(p[0], p[1])[0], snapToGrid(p[0], p[1])[1])).join(",");
    if (!S.quantized || dragCell !== S.quantizedCell) {
      S.quantizedCell = dragCell;
      sendPayload();
    }
  } else {
    S.cursor = raw;
    S.snappedCursor = snapToGrid(raw[0], raw[1]);
    render();
    const cell = gridCell(S.snappedCursor[0], S.snappedCursor[1]);
    if (!S.quantized || cell !== S.quantizedCell) {
      S.quantizedCell = cell;
      sendPayload();
    }
  }
});

field.addEventListener("pointerup", (evt) => {
  S.dragging = -1;
  field.releasePointerCapture(evt.pointerId);
  sendPayload();
});

gridEl.addEventListener("input", () => { S.grid = Number(gridEl.value); gridVal.textContent = String(S.grid); S.quantizedCell = -1; sendPayload(); });
sigmaEl.addEventListener("input", () => { S.sigma = Number(sigmaEl.value); sigmaVal.textContent = S.sigma.toFixed(2); sendPayload(); });

modeBtn.addEventListener("click", () => {
  S.heatMode = S.heatMode === "magnitude" ? "confidence" : "magnitude";
  modeBtn.textContent = S.heatMode === "magnitude" ? "Heat: Mag" : "Heat: Conf";
  sendPayload();
});

influenceBtn.addEventListener("click", () => {
  S.influenceMode = S.influenceMode === "raw" ? "percentage" : "raw";
  influenceBtn.textContent = S.influenceMode === "raw" ? "Influence: Raw" : "Influence: %";
  sendPayload();
});

decodeBtn.addEventListener("click", () => {
  S.decodeEnabled = !S.decodeEnabled;
  decodeBtn.classList.toggle("active", S.decodeEnabled);
  decodeBtn.textContent = S.decodeEnabled ? "Decode: On" : "Decode: Off";
  if (!S.decodeEnabled) {
    S.recon = [];
    S.decodeStatus = "idle";
    S.decodeStep = -1;
    render();
  }
  sendPayload();
});

quantizeBtn.addEventListener("click", () => {
  S.quantized = !S.quantized;
  S.quantizedCell = -1;
  quantizeBtn.classList.toggle("active", S.quantized);
  quantizeBtn.textContent = S.quantized ? "Mode: Quantized" : "Mode: Continuous";
  sendPayload();
});

checkpointModeEl.addEventListener("change", () => {
  if (suppressModelEvents) return;
  const mode = checkpointModeEl.value;
  modelSelection.mode = mode;
  modelSelection.previous = 0;
  pendingModelSwitch = { mode, previous: 0 };
  renderModelSelectors();
  frameInFlight = false;
  queuedPayload = null;
  socket.emit("select_model", { mode, previous: 0 });
});

checkpointStampEl.addEventListener("change", () => {
  if (suppressModelEvents) return;
  const mode = checkpointModeEl.value;
  const previous = Number(checkpointStampEl.value || 0);
  modelSelection.mode = mode;
  modelSelection.previous = previous;
  pendingModelSwitch = { mode, previous };
  renderModelSelectors();
  frameInFlight = false;
  queuedPayload = null;
  socket.emit("select_model", { mode, previous });
});

window.addEventListener("resize", render);

socket = io();

socket.on("connect", () => {
  setConnectionState(true);
  statusEl.textContent = "connected to server";
  socket.emit("bootstrap");
});

socket.on("bootstrap", (data) => {
  frameInFlight = false;
  pendingModelSwitch = null;
  S.cursor = data.cursor;
  S.snappedCursor = data.cursor;
  S.points = data.draggable_points;
  S.snappedPoints = data.draggable_points.map(p => [...p]);
  S.heatmap = data.heatmap || [];
  S.latent = data.latent_vector || [];
  S.recon = data.decoded_matrix || [];
  S.influenceRaw = data.influence_raw || [];
  S.influencePct = data.influence_percentage || [];
  S.grid = data.slider_values.gridResolution;
  S.sigma = data.slider_values.sigma;
  S.heatMode = data.button_values.heatmapMode;
  S.influenceMode = data.button_values.influenceMode;
  S.decodeEnabled = !!data.button_values.decodeEnabled;
  S.halfExtent = data.field_half_extent;
  S.nTiming = data.n_timing;
  S.decodeStatus = data.decode_status || "idle";
  S.decodeStep = Number.isFinite(data.decode_progress_step) ? data.decode_progress_step : -1;
  modelCatalog = data.model_options || { modes: {} };
  modelSelection = data.model_selection || { mode: "none", previous: 0, timestamp: null };
  gridEl.value = String(S.grid);
  sigmaEl.value = String(S.sigma);
  gridVal.textContent = String(S.grid);
  sigmaVal.textContent = S.sigma.toFixed(2);
  modeBtn.textContent = S.heatMode === "magnitude" ? "Heat: Mag" : "Heat: Conf";
  influenceBtn.textContent = S.influenceMode === "raw" ? "Influence: Raw" : "Influence: %";
  decodeBtn.classList.toggle("active", S.decodeEnabled);
  decodeBtn.textContent = S.decodeEnabled ? "Decode: On" : "Decode: Off";
  renderModelSelectors();
  render();
  sendPayload(true);
});

socket.on("frame", (data) => {
  frameInFlight = false;
  // cursor and points are client-authoritative — never overwrite from server echo
  S.heatmap = data.heatmap;
  S.latent = data.latent_vector;
  S.recon = data.decoded_matrix;
  S.influenceRaw = data.influence_raw;
  S.influencePct = data.influence_percentage;
  S.heatMode = data.button_values.heatmapMode;
  S.influenceMode = data.button_values.influenceMode;
  S.decodeEnabled = !!data.button_values.decodeEnabled;
  S.grid = data.slider_values.gridResolution;
  S.sigma = data.slider_values.sigma;
  S.halfExtent = data.field_half_extent;
  S.nTiming = data.n_timing;
  S.decodeStatus = data.decode_status || "idle";
  S.decodeStep = Number.isFinite(data.decode_progress_step) ? data.decode_progress_step : -1;
  // Keep model selection authoritative from bootstrap/select_model to avoid
  // stale frame responses reverting dropdown state mid-switch.
  if (!pendingModelSwitch && data.model_options) {
    modelCatalog = data.model_options;
  }
  if (!pendingModelSwitch && data.model_selection) {
    modelSelection = data.model_selection;
  }
  gridEl.value = String(S.grid);
  sigmaEl.value = String(S.sigma);
  gridVal.textContent = String(S.grid);
  sigmaVal.textContent = S.sigma.toFixed(2);
  modeBtn.textContent = S.heatMode === "magnitude" ? "Heat: Mag" : "Heat: Conf";
  influenceBtn.textContent = S.influenceMode === "raw" ? "Influence: Raw" : "Influence: %";
  decodeBtn.classList.toggle("active", S.decodeEnabled);
  decodeBtn.textContent = S.decodeEnabled ? "Decode: On" : "Decode: Off";
  renderModelSelectors();
  render();
  flushPayload();
});

socket.on("disconnect", () => {
  setConnectionState(false);
  statusEl.textContent = "disconnected from server";
});

socket.on("error", (err) => {
  frameInFlight = false;
  pendingModelSwitch = null;
  setConnectionState(false);
  const msg = typeof err === "string" ? err : (err && err.message) ? err.message : JSON.stringify(err);
  statusEl.textContent = `error: ${msg}`;
  updateModelStatus();
  flushPayload();
});

setConnectionState(false);
gridEl.value = String(S.grid);
sigmaEl.value = String(S.sigma);
gridVal.textContent = String(S.grid);
sigmaVal.textContent = S.sigma.toFixed(2);
updateModelStatus();
render();
</script>
</body>
</html>
