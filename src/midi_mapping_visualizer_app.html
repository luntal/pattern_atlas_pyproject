<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>MIDI Mapping Flow Visualizer</title>
	<style>
		:root {
			--bg: #f4f6f8;
			--panel: #ffffff;
			--text: #1f2937;
			--muted: #4b5563;
			--border: #d1d5db;
			--accent: #0f766e;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
			color: var(--text);
			background: linear-gradient(150deg, #eef2f7 0%, #f8fafc 100%);
		}

		.page {
			max-width: 1100px;
			margin: 2rem auto;
			padding: 0 1rem;
		}

		.card {
			background: var(--panel);
			border: 1px solid var(--border);
			border-radius: 12px;
			padding: 1.25rem;
			box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
		}

		h1 {
			margin: 0;
			font-size: 1.5rem;
			line-height: 1.2;
			letter-spacing: 0.01em;
		}

		.subtitle {
			margin: 0.5rem 0 0;
			color: var(--muted);
			font-size: 0.98rem;
		}

		.legend {
			margin-top: 1rem;
			color: var(--muted);
			font-size: 0.92rem;
		}

		.diagram {
			margin-top: 1.25rem;
			overflow-x: auto;
		}

		.mermaid {
			min-width: 760px;
			text-align: center;
		}

		.accent {
			color: var(--accent);
			font-weight: 600;
		}
	</style>
	<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body>
	<main class="page">
		<section class="card">
			<h1>MIDI Mapping Flow</h1>
			<p class="subtitle">
				Visual overview of mappings around the <span class="accent">Compressed Generic MIDI Mapping</span> representation.
			</p>

			<div class="diagram">
				<div class="mermaid">
__MERMAID_GRAPH__
				</div>
			</div>

			<p class="legend">
				Branching: Groove MIDI Mapping and Generic MIDI Mapping (Input) both feed the compressed representation.
			</p>
		</section>
	</main>

	<script>
		mermaid.initialize({
			startOnLoad: true,
			theme: "default",
			flowchart: {
				curve: "basis",
				htmlLabels: true,
				useMaxWidth: true
			}
		});
	</script>
</body>
</html>
